# A milestone/branch release nomeia a sprint, não a versão da aplicação.
mode: Mainline
base-version: 0.0.0
next-version: 0.0.1
commit-message-incrementing: Disabled
branches:
  main:
    regex: ^master$
    is-mainline: true
    increment: Patch
    tag: ''
  release:
    regex: ^release[/-]
    is-release-branch: false
